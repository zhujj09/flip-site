{{- /* 图片＋图注：{{< fig src="uploads/xx.jpg" alt="..." caption="..." >}} */ -}}
<figure class="flip-fig not-prose">
  <img src="{{ .Get "src" | relURL }}" alt="{{ .Get "alt" | default (.Get "caption") }}" loading="lazy">
  {{- with .Get "caption" }}<figcaption>{{ . | markdownify }}</figcaption>{{ end }}
</figure>
